# Shared no_std logic for TCP SYN fingerprinting.
# Used by huginn-ebpf-programs (BPF kernel programs) and huginn-ebpf (userspace).
# Must compile for bpfel-unknown-none and for host (tests).

[package]
name = "huginn-ebpf-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared quirk bits and key encoding for huginn eBPF SYN fingerprinting"

[lib]
path = "src/lib.rs"

[features]
# Implement aya::Pod for SynRawDataV4 (userspace only). Not enabled for BPF target.
aya = ["dep:aya"]

[dependencies]
aya = { workspace = true, optional = true }

[dev-dependencies]

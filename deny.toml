[advisories]
version = 2
unmaintained = "all"
ignore = [
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib"
]
confidence-threshold = 1.0

# BSL-1.0 (Boost Software License) is OSI and FSF approved. Pulled in only by
# `xxhash-rust`, a non-optional dependency of `notify` 9.0.0 (used by huginn-proxy-lib).
[[licenses.exceptions]]
name = "xxhash-rust"
allow = ["BSL-1.0"]

[bans]
wildcards = "deny"
# Path-only workspace deps (`{ path = "..." }` / `{ workspace = true }`) look like
# `*` to cargo-deny; allow those while still denying registry wildcards.
allow-wildcard-paths = true

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

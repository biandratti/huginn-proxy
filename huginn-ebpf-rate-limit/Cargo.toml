# Shared no_std rate-limiting algorithm for eBPF SYN capture.
# Used by huginn-ebpf-programs (BPF kernel programs).
# Must compile for bpfel-unknown-none and for host (tests).

[package]
name = "huginn-ebpf-rate-limit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

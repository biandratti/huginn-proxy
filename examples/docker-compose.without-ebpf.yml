services:
  proxy:
    build:
      context: ..
      dockerfile: docker/proxy.Dockerfile
      target: plain
    command: ["/usr/local/bin/huginn-proxy"]
    environment:
    # - HUGINN_CONFIG_PATH=/config/compose.toml
      - HUGINN_CONFIG_PATH=/config/compose.yaml
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      #- ./config/compose.toml:/config/compose.toml:ro
      - ./config/compose.yaml:/config/compose.yaml:ro
      - ./certs:/config/certs:ro
    ports:
      - "0.0.0.0:80:80"
      - "[::]:80:80"
      - "0.0.0.0:443:443"
      - "[::]:443:443"
      - "0.0.0.0:9090:9090"
      - "[::]:9090:9090"
    cap_add:
      - CAP_NET_BIND_SERVICE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "127.0.0.1:9090", "/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      backend-a:
        condition: service_started
      backend-b:
        condition: service_started

  backend-a:
    image: traefik/whoami
    command: ["--port", "9000"]

  backend-b:
    image: traefik/whoami
    command: ["--port", "9000"]

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:dead:beef:1::/64

name: 'Setup eBPF build dependencies'
description: 'Install Rust nightly + rust-src required to compile huginn-ebpf-programs for bpfel-unknown-none'
runs:
  using: 'composite'
  steps:
    - name: Install Rust nightly with rust-src and clippy
      shell: bash
      run: rustup toolchain install nightly --component rust-src --component clippy
    - name: Install cargo-binstall
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-binstall
    - name: Install bpf-linker
      shell: bash
      # bpf-linker 0.11+ links against system LLVM; use prebuilt binaries instead of cargo install.
      run: cargo binstall bpf-linker --no-confirm

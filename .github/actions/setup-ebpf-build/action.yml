name: 'Setup eBPF build dependencies'
description: 'Install Rust nightly + rust-src required to compile huginn-ebpf-programs for bpfel-unknown-none'
runs:
  using: 'composite'
  steps:
    - name: Install Rust nightly with rust-src and clippy
      shell: bash
      run: rustup toolchain install nightly --component rust-src --component clippy
    # Prebuilt Linux artifacts are musl, not gnu
    # (https://github.com/aya-rs/bpf-linker#installation). `cargo binstall` on
    # ubuntu-latest looks for x86_64-unknown-linux-gnu, misses, and falls back
    # to `cargo install`, which needs llvm-config.
    - name: Install bpf-linker
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64) triple=x86_64-unknown-linux-musl ;;
          aarch64|arm64) triple=aarch64-unknown-linux-musl ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        curl -fsSL -o /tmp/bpf-linker.tar.zst \
          "https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-${triple}.tar.zst"
        mkdir -p "$HOME/.local/bin"
        tar -xpf /tmp/bpf-linker.tar.zst -C "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

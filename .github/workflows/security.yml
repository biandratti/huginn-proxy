name: Advanced Security

on:
  push:
    branches: [ "master" ]
  pull_request:
  schedule:
    - cron: '0 2 * * 6'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  cargo-geiger:
    name: Unsafe Code Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - huginn-proxy
          - huginn-certs
          - huginn-proxy-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      
      - name: Cache cargo-geiger
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-geiger
          key: cargo-geiger-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-geiger-${{ runner.os }}-
            
      - name: Install cargo-geiger
        run: |
          if ! command -v cargo-geiger &> /dev/null; then
            cargo install cargo-geiger
          else
            echo "cargo-geiger already installed"
          fi
      
      - name: Run unsafe code analysis for ${{ matrix.crate }}
        run: |
          echo "Analyzing ${{ matrix.crate }}..."
          cargo geiger --forbid-only --all-features --all-targets --manifest-path "${GITHUB_WORKSPACE}/${{ matrix.crate }}/Cargo.toml"

name: Docker Build and Scan

on:
  push:
    branches: ["master"]
  workflow_call:
    inputs:
      push:
        description: 'Push images to registry after scan'
        type: boolean
        default: false
      registry:
        description: 'Container registry (e.g. ghcr.io)'
        type: string
        default: 'ghcr.io'
      image_name:
        description: 'Base image name without registry (e.g. owner/repo). Plain and agent images append -plain and -ebpf-agent.'
        type: string
        default: ''
    secrets:
      registry_token:
        required: false
    outputs:
      image_tag:
        description: 'Full registry image tag (e.g. ghcr.io/owner/repo:1.0.0)'
        value: ${{ jobs.prepare.outputs.image_tag }}
      tag:
        description: 'Version tag (e.g. 1.0.0)'
        value: ${{ jobs.prepare.outputs.tag }}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Compute tag and image ref
        id: vars
        env:
          REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
          IMAGE_NAME: ${{ inputs.image_name || github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/[0-9]* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=sha-${GITHUB_SHA::7}
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image_tag=${REGISTRY}/${IMAGE_NAME}:${TAG}" >> $GITHUB_OUTPUT

  build-scan:
    name: Build and scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ inputs.push == true && 'release' || '' }}
    permissions:
      contents: read
      security-events: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ebpf
            dockerfile: ./docker/proxy.Dockerfile
            target: ebpf
            image_repo_suffix: ''
            platforms: linux/amd64,linux/arm64
          - name: plain
            dockerfile: ./docker/proxy.Dockerfile
            target: plain
            image_repo_suffix: '-plain'
            platforms: linux/amd64,linux/arm64
          - name: ebpf-agent
            dockerfile: ./docker/ebpf-agent.Dockerfile
            target: ''
            image_repo_suffix: '-ebpf-agent'
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ inputs.registry || 'ghcr.io' }}/${{ inputs.image_name || github.repository }}${{ matrix.image_repo_suffix }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_call' && inputs.push }}

      - name: Set up QEMU
        if: ${{ inputs.push == true }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to registry
        if: ${{ inputs.push == true }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token }}

      - name: Build Docker image (amd64 for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ inputs.registry || 'ghcr.io' }}/${{ inputs.image_name || github.repository }}${{ matrix.image_repo_suffix }}:scan-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.name }}

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.registry || 'ghcr.io' }}/${{ inputs.image_name || github.repository }}${{ matrix.image_repo_suffix }}:scan-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Build and push (multi-platform, reusing cache)
        if: ${{ inputs.push == true }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=docker-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.name }}
